<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Oskeg Case</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0d0919;--card:#181129;--card2:#211838;--line:rgba(255,255,255,.08);--tx:#f4f0ff;--mu:#9a90b8;--gold:#ffc24b;--pink:#ff4fa3;--cy:#4ad7ff;--vi:#9b7bff;--ok:#3ddc97;--bad:#ff5c6c;
--c5:#ff7a45;--c6:#fff1a8;--c0:#8b93b8;--c1:#4ad7ff;--c2:#9b7bff;--c3:#ff4fa3;--c4:#ffc24b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{overflow-x:hidden;max-width:100%;height:100%;background:var(--bg);color:var(--tx);font:600 15px/1.35 Manrope,system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(600px 400px at 90% -5%,rgba(155,123,255,.28),transparent),radial-gradient(500px 400px at -10% 30%,rgba(255,79,163,.16),transparent),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.d{font-family:Unbounded,Manrope,sans-serif}
#app{overflow-x:hidden;max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.logo{font:900 17px Unbounded;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;color:transparent}
.bal{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 14px;font:700 15px Unbounded}
.bal i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#ff8a3d);color:#2a1500;font-size:18px;line-height:1}
h2{font:700 20px Unbounded;margin:6px 0 14px}
h3{font:700 14px Unbounded;margin:18px 0 10px}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%);z-index:20}
nav div{display:flex;width:100%;max-width:500px;background:rgba(27,19,46,.97);border:1px solid var(--line);border-radius:24px;padding:5px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;font-size:10.5px;color:var(--mu);font-weight:800;transition:.2s}
nav button b{font-size:20px;filter:grayscale(1);opacity:.7;transition:.2s}
nav button.on{background:linear-gradient(135deg,rgba(155,123,255,.35),rgba(255,79,163,.3));color:#fff}
nav button.on b{filter:none;opacity:1;transform:translateY(-1px) scale(1.12)}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font:700 14px Unbounded;text-align:center;background:linear-gradient(135deg,var(--vi),var(--pink));color:#fff;box-shadow:0 8px 24px -8px var(--pink);transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.gold{background:linear-gradient(135deg,var(--gold),#ff8a3d);color:#2a1500;box-shadow:0 8px 24px -8px var(--gold)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line)}.btn.dis{opacity:.45;pointer-events:none}
.chip{padding:10px 4px;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-align:center;font-weight:800;transition:.15s}
.chip.on{border-color:var(--gold);background:rgba(255,194,75,.14);color:var(--gold)}
.chip small{display:block;color:var(--mu);font-weight:700;font-size:11px}
/* case cards */
.case{position:relative;overflow:hidden;text-align:center;padding:18px 10px 14px;border-radius:22px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.case:before{content:"";position:absolute;inset:-40% -20% auto;height:90%;background:radial-gradient(circle,var(--gl),transparent 65%);opacity:.5}
.case .em{position:relative;font-size:64px;line-height:1;animation:float 3.2s ease-in-out infinite}
.case .nm{position:relative;margin-top:10px;font:700 13px Unbounded}
.case .pr{position:relative;margin-top:6px;display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.35);color:var(--gold);font-weight:800}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
/* item tiles */
.it{position:relative;border-radius:16px;padding:10px 6px 8px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 22%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);overflow:hidden}
.it .e{font-size:38px;line-height:1.1;filter:drop-shadow(0 4px 10px var(--rc))}
.it{min-width:0}.it .n{font-size:11px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .v{font-size:11px;color:var(--gold);font-weight:800}.it .x{position:absolute;top:4px;right:7px;font-size:11px;color:var(--mu)}
.it small{display:block;color:var(--mu);font-size:10px}
/* roulette */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,5,16,.94);display:flex;flex-direction:column;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.win{position:relative;overflow:hidden;height:150px;border-block:1px solid var(--line);background:#0a0714}
.win:before,.win:after{content:"";position:absolute;top:0;bottom:0;width:22%;z-index:2;pointer-events:none}
.win:before{left:0;background:linear-gradient(90deg,#0a0714,transparent)}.win:after{right:0;background:linear-gradient(270deg,#0a0714,transparent)}
.mark{position:absolute;left:50%;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 18px 3px var(--gold);z-index:3}
.strip{display:flex;gap:8px;padding:14px 0;will-change:transform}
.strip .it{flex:0 0 104px;height:122px;display:flex;flex-direction:column;justify-content:center}
.strip .it.hit{animation:hit .6s .1s both}@keyframes hit{50%{transform:scale(1.14)}}
.ovt{text-align:center;font:700 18px Unbounded;margin-bottom:22px;padding:0 20px}
.reveal{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,5,16,.96);padding:24px;text-align:center}
.rays{position:absolute;width:520px;height:520px;background:repeating-conic-gradient(from 0deg,var(--rc) 0 8deg,transparent 8deg 24deg);opacity:.18;border-radius:50%;animation:spin 14s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
.big{position:relative;font-size:120px;line-height:1;filter:drop-shadow(0 0 36px var(--rc));animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
/* mines */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cell{aspect-ratio:1;border-radius:18px;background:linear-gradient(160deg,var(--card2),#150e26);border:1px solid var(--line);font-size:34px;display:grid;place-items:center;transition:.2s;position:relative}
.cell:active{transform:scale(.93)}.cell.gem{background:linear-gradient(160deg,rgba(61,220,151,.35),rgba(61,220,151,.1));border-color:var(--ok);animation:flip .4s}
.cell.bomb{background:rgba(255,92,108,.2);border-color:var(--bad)}.cell.hit{animation:shake .5s;background:var(--bad)}.cell.ghost{opacity:.5}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mult{font:900 34px Unbounded;text-align:center;background:linear-gradient(90deg,var(--ok),var(--cy));-webkit-background-clip:text;color:transparent}
/* upgrader */
.wheel{position:relative;width:230px;height:230px;margin:6px auto 16px}
.ring{position:absolute;inset:0;border-radius:50%}.ring svg{display:block;width:100%;height:100%}
.ptr{position:absolute;inset:0;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.ptr:before{content:"";position:absolute;left:50%;top:-4px;margin-left:-8px;border:8px solid transparent;border-top:16px solid #fff}
.ptr,.wc,.ring{background-color:transparent}.wc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:900 26px Unbounded}
/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;animation:fade .2s}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60%)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);z-index:90;padding:11px 18px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:800;transition:.35s cubic-bezier(.2,1.3,.4,1);max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}#toast.err{border-color:var(--bad)}#toast.ok{border-color:var(--ok)}
input{width:100%;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font:700 15px Manrope;outline:0;margin-bottom:10px}
input:focus{border-color:var(--vi)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.lock{opacity:.4}
.gi{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 4px 10px var(--rc))}.gi.sm{width:72px;height:72px}.gi.xl{width:170px;height:170px;filter:drop-shadow(0 0 30px var(--rc))}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:4px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:800;color:var(--mu)}.tabs .on{background:var(--card2);color:#fff}
.road{display:flex;gap:6px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}.road::-webkit-scrollbar{display:none}
.lane{flex:0 0 78px;height:150px;border-radius:16px;background:repeating-linear-gradient(0deg,#2a2342 0 14px,#231c3a 14px 28px);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px 0;transition:.3s}
.lane.done{background:rgba(61,220,151,.14);border-color:var(--ok)}.lane.dead{background:rgba(255,92,108,.25);border-color:var(--bad);animation:shake .5s}
.lm{font:800 11px Manrope;color:var(--gold)}.lc{font-size:38px;line-height:1}.lc.hop{animation:hop .55s}
@keyframes hop{0%{transform:translate(-70px,0)}50%{transform:translate(-35px,-34px)}100%{transform:translate(0,0)}}
.coinw{perspective:700px;width:140px;height:140px;margin:14px auto 22px}
.cn{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 2s cubic-bezier(.15,.7,.2,1)}
.cf{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;line-height:1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#b8741a);box-shadow:0 0 40px rgba(255,194,75,.4),inset 0 0 0 6px rgba(0,0,0,.12)}
.cf small{font:800 10px Unbounded;color:#5a3300;margin-top:4px}.cf.b{transform:rotateY(180deg)}
.live{font:800 10px Manrope;vertical-align:middle;padding:3px 8px;border-radius:99px;background:rgba(255,92,108,.2);color:var(--bad);margin-left:6px;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.4}}
.hist{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 10px;scrollbar-width:none}.hc{flex:0 0 auto;padding:4px 10px;border-radius:99px;font-weight:800;font-size:12px}.hc.h1{background:rgba(255,92,108,.18);color:var(--bad)}.hc.h2{background:rgba(61,220,151,.16);color:var(--ok)}.hc.h3{background:rgba(255,194,75,.2);color:var(--gold)}
/* LIVE-лента дропов (антиспойлер: на сервере дроп появляется с задержкой, пока идёт открытие — лента заморожена) */
.lf{display:flex;align-items:center;gap:8px;margin:-6px 0 12px;padding:6px 6px 6px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.lf[hidden]{display:none}
.lf .lb{flex:0 0 auto;display:flex;align-items:center;gap:5px;font:800 10px Manrope;color:var(--bad);letter-spacing:.6px}
.lf .lb:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:pulse 1.4s infinite}
.lf .ls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}.lf .ls::-webkit-scrollbar{display:none}
.lf .lc2{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 22%,var(--card2)),var(--card2));border:1px solid color-mix(in srgb,var(--rc) 50%,transparent)}
.lf .lc2.nw{animation:lfin .5s cubic-bezier(.2,1.3,.4,1)}@keyframes lfin{from{opacity:0;transform:translateX(-24px) scale(.8)}}
.lf .lc2.me{border-color:var(--gold)}
.lf .lc2 .li{width:30px;height:30px;display:grid;place-items:center;font-size:22px;line-height:1}.lf .lc2 .li img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 6px var(--rc))}
.lf .lc2 .lt{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}.lf .lc2 .lt b{font-size:11px;font-weight:800}.lf .lc2 .lt small{font-size:9.5px;color:var(--mu);font-weight:700}
.lf .le{color:var(--mu);font-size:12px}
/* case icon sprite, animation picker, boxes */
.case .em img{width:78px;height:78px;object-fit:contain;display:block;margin:0 auto}
.apick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.apick .chip{padding:10px 2px;font-size:12px}.apick .chip b{display:block;font-size:22px;font-weight:400}
.bx{position:relative;aspect-ratio:.85;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.bxl{font-size:58px;animation:float 2.4s ease-in-out infinite}.bxc{width:100%;padding:4px}.bxc .it{padding:8px 2px}
.bx.shake{animation:shk .7s}@keyframes shk{10%,90%{transform:translateX(-4px) rotate(-3deg)}30%,70%{transform:translateX(6px) rotate(4deg)}50%{transform:translateX(-6px) rotate(-5deg)}}
.bx.open{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}.bx.dim{opacity:.45;filter:saturate(.6)}
.bigbox{font-size:130px;line-height:1;text-align:center;filter:drop-shadow(0 0 26px var(--rc));animation:shk2 .22s infinite,grow 1.8s forwards}
@keyframes shk2{50%{rotate:7deg}}@keyframes grow{from{transform:scale(.8)}to{transform:scale(1.55)}}
.bigbox.boom{animation:boom .45s forwards}@keyframes boom{to{transform:scale(4);opacity:0;filter:brightness(4)}}
/* dice & wheel */
.dbar{position:relative;height:16px;border-radius:99px;background:rgba(255,92,108,.35);margin:6px 4px 4px}.dbar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.dbar b{position:absolute;top:-6px;width:4px;height:28px;margin-left:-2px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff;transition:left .05s}
input[type=range]{padding:0;height:34px;accent-color:#9b7bff}
.whw{position:relative;width:280px;max-width:84vw;margin:4px auto 16px}.whw:before{content:"";position:absolute;left:50%;top:-8px;margin-left:-11px;border:11px solid transparent;border-top:22px solid #fff;filter:drop-shadow(0 0 6px #fff);z-index:2}
#wh{transition:transform 4.6s cubic-bezier(.12,.7,.1,1)}

/* ===== новое: графика кейсов, входные анимации, анимации открытия ===== */
.fi{animation:fi .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes fi{from{opacity:0;transform:translateY(20px) scale(.92)}}
.cart{width:92px;height:92px;display:block;margin:0 auto;overflow:visible}
.cart .lid{transform-box:fill-box;transform-origin:50% 100%}
.cart.big .lid,.cars>.case.cur .cart .lid{animation:lidb 3.6s ease-in-out infinite}
@keyframes lidb{0%,68%,100%{transform:none}76%{transform:translateY(-6px) rotate(-5deg)}84%{transform:translateY(-2px) rotate(3deg)}92%{transform:none}}
.cart .sp{transform-box:fill-box;transform-origin:center;opacity:0}
.cart.big .sp,.cars>.case.cur .cart .sp{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.case .em{animation:float 3.2s ease-in-out infinite}
.case .rt{position:relative;margin-top:7px;font-size:11px;color:var(--ok);font-weight:800}
.case:active{transform:scale(.97)}.case{transition:transform .15s}
.stage{position:relative;text-align:center;padding:4px 0 2px;margin-bottom:6px}
.stage:before{content:"";position:absolute;left:50%;top:84px;width:320px;height:320px;margin:-160px 0 0 -160px;background:repeating-conic-gradient(var(--gl) 0 6deg,transparent 6deg 24deg);opacity:.16;border-radius:50%;animation:spin 20s linear infinite,hin 1s both;-webkit-mask:radial-gradient(circle,#000 14%,transparent 68%);mask:radial-gradient(circle,#000 14%,transparent 68%)}
.halo{position:absolute;left:50%;top:84px;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(circle,var(--gl),transparent 66%);animation:halo 3s ease-in-out infinite,hin .8s both}
@keyframes halo{50%{transform:scale(1.18);opacity:.7}}@keyframes hin{from{opacity:0;transform:scale(.3)}}
.cart.big{width:160px;height:160px;position:relative;margin:6px auto 0;animation:cdrop .95s cubic-bezier(.2,1.5,.4,1) both,float 3.4s .95s ease-in-out infinite}
@keyframes cdrop{from{transform:translateY(-110px) scale(.3) rotate(-24deg);opacity:0}60%{opacity:1}}
.stage h2{position:relative;margin:8px 0 8px;animation:fi .6s .35s both}
.badges{position:relative;display:flex;gap:8px;justify-content:center;animation:fi .6s .5s both}
.bd{padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--gold)}.bd:first-child{color:var(--ok)}
.apick{grid-template-columns:repeat(3,1fr)!important}
.apick .chip{position:relative;overflow:hidden;padding:11px 2px;transition:.2s}
.apick .chip b{display:block;width:max-content;margin:0 auto 3px;font-size:24px}
.apick .chip.on{animation:selp .55s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 1px var(--gold),0 6px 22px -6px var(--gold)}
.apick .chip.on b{animation:wig .8s}
.apick .chip.on:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 1.1s .1s both}
@keyframes selp{40%{transform:scale(1.1)}}@keyframes wig{20%{transform:rotate(-18deg) scale(1.3)}50%{transform:rotate(14deg) scale(1.2)}80%{transform:rotate(-6deg)}}@keyframes sweep{to{left:130%}}
.gstage{position:relative;width:270px;height:270px;margin:0 auto;display:grid;place-items:center}
.gstage .rays{opacity:0;transition:opacity .7s;width:460px;height:460px;left:50%;top:50%;margin:-230px 0 0 -230px}.gstage.go .rays{opacity:.4}
.gstage .cart.big{width:210px;height:210px;animation:none;margin:0;z-index:1}
.gstage.shk .cart.big{animation:shk .45s infinite}
.gstage .gitem{font-size:96px;line-height:1;position:absolute;z-index:2;opacity:0;transform:translateY(50px) scale(.2);transition:1.1s cubic-bezier(.2,1.5,.4,1)}
.gstage.go .gitem{opacity:1;transform:translateY(-60px) scale(1)}
.gstage.go .lid{animation:none;transform:translateY(-120px) rotate(-30deg);opacity:0;transition:.9s cubic-bezier(.3,.8,.3,1)}
.slot{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
.reel{height:360px;overflow:hidden;border-radius:18px;background:#0a0714;border:1px solid var(--line);-webkit-mask:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.rs{will-change:transform}.reel .it{height:120px;border-radius:0;display:flex;flex-direction:column;justify-content:center}
.slmid{position:absolute;left:10px;right:10px;top:120px;height:120px;border:2px solid var(--gold);border-radius:18px;box-shadow:0 0 22px var(--gold),inset 0 0 22px rgba(255,194,75,.25);pointer-events:none;z-index:3}
.solo{display:flex;align-items:center;gap:14px}.solo>div{width:112px;flex:none}

html[data-th=violet] .logo{background:linear-gradient(90deg,#ffd36b,#c084fc);-webkit-background-clip:text;color:transparent}
html[data-th=violet] nav div{background:rgba(26,15,60,.97)}
html[data-th=violet] .btn:not(.gold):not(.ghost){background:linear-gradient(135deg,#8b5cf6,#c084fc)}
/* ===== проще: убираем лишнее ===== */
.seg,.npv{display:none!important}
html[data-th=violet] .cc-art{background:radial-gradient(70% 60% at 50% 50%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 72%),linear-gradient(168deg,#352170,#150c33 92%)}
html[data-th=violet] .case.cc{background:#150c33;box-shadow:inset 0 0 0 1.5px rgba(167,139,250,.35),0 16px 30px -18px #8b5cf6}
html[data-th=violet] .cc-art:after{background:linear-gradient(180deg,transparent 62%,rgba(21,12,51,.9))}
.cc-stars,.cc-rays{display:none}
.cc-tag{background:rgba(20,10,48,.7)}
</style>
</head>
<body>
<div id="app"><header><div class="logo"><span class="lgi"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l8 5v10l-8 5-8-5V7z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 7l8 5 8-5M12 12v10" fill="none" stroke="#fff" stroke-width="1.4" opacity=".85"/></svg></span><span class="lgt"><b>OSKEG</b><small>CASE</small></span></div><div class="bal" id="bal"><i class="bst">★</i><span class="bcol"><small>БАЛАНС</small><span id="balv">0</span></span><button class="bplus" aria-label="Пополнить" onclick="event.stopPropagation();depSheet()">+</button></div></header><div id="lf" class="lf" hidden></div><main id="view"></main></div>
<nav><div id="nav"></div></nav><div id="toast"></div><canvas id="fx"></canvas>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0d0919');tg.setBackgroundColor('#0d0919');tg.disableVerticalSwipes()}catch(e){}
const $=s=>document.querySelector(s),RC=['--c0','--c1','--c2','--c3','--c4','--c5','--c6'];
let S=null,C=null,tab='cases',busy=false,sub={};
const hap=(t='light')=>{if(window.UI&&!UI.hap)return;try{tg.HapticFeedback.impactOccurred(t)}catch(e){}},hn=t=>{if(window.UI&&!UI.hap)return;try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function flashFx(k){const f=document.createElement('div');f.className='flfx '+k;document.body.appendChild(f);setTimeout(()=>f.remove(),700)}
function toast(t,k=''){if(k==='ok'||k==='err')flashFx(k);const e=$('#toast');e.textContent=t;e.className='show '+k;clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2600)}
let shown=0;
function paintBal(){const to=S.u.balance,from=shown,t0=performance.now();(function f(){const k=Math.min(1,(performance.now()-t0)/700);shown=Math.round(from+(to-from)*k);$('#balv').textContent=nf(shown);if(k<1)requestAnimationFrame(f)})()}
async function api(p,b,hold,light){
  const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init':tg.initData},body:JSON.stringify(b||{})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){if(!light){toast(j.error||'Ошибка соединения','err');hn('error')}throw j}
  if(j.me){S=j.me;if(j.cfg)C=j.cfg;if(!hold)paintBal();
    if(S.ach_new&&S.ach_new.length)setTimeout(()=>{toast('🏆 '+S.ach_new.join(', '),'ok');hn('success')},hold?4500:900)}
  return j}
/* items */
const IMGSRC=x=>"/img/"+x+".png";
const gi=(k,e,cls="")=>{const x=k[0]==="i"?k.slice(2):"";return C.imgs&&C.imgs.includes(x)?`<img class="gi ${cls}" src="${IMGSRC(x)}" alt="" loading="lazy" decoding="async">`:e};
const nf=n=>Number(n).toLocaleString('ru-RU');
const rar=v=>v>=50000?6:v>=5000?5:v>=900?4:v>=500?3:v>=300?2:v>=50?1:0;
function info(k){const[t,x]=[k[0],k.slice(2)];if(t==='s')return{e:'⭐',n:x+' звёзд',v:+x,r:rar(+x),k};const i=C.items[x];return{e:i.emoji,n:i.name,v:i.value,r:rar(i.value),k}}
const tile=(d,extra='',cls='')=>`<div class="it ${cls}" style="--rc:var(${RC[d.r]})">${extra}<div class="e">${gi(d.k,d.e)}</div><div class="n">${d.n}</div><div class="v">${nf(d.v)} ⭐</div></div>`;
function paint(){let ub=$('#upbg');if(!ub){ub=document.createElement('div');ub.id='upbg';ub.innerHTML='<i></i><i></i><i></i>';document.body.prepend(ub)}ub.classList.toggle('on',tab==='up');document.body.dataset.tab=tab;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
const TABS=[['cases','🎁','Кейсы'],['games','🎮','Игры'],['up','🚀','Апгрейд'],['inv','🎒','Склад'],['me','👤','Профиль']];
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
$('#bal').onclick=()=>go('me');
function go(t){if(busy)return;tab=t;sub={};paint();hap();render()}
function render(){stopLive();({cases:vCases,games:vGames,up:vUp,inv:vInv,me:vMe})[tab]();scrollTo(0,0)}
/* sheet */
function sheet(h){closeSheet();const s=document.createElement('div');s.className='sheet';s.innerHTML='<div>'+h+'</div>';s.onclick=e=>{if(e.target===s)closeSheet()};document.body.appendChild(s)}
function closeSheet(){document.querySelectorAll('.sheet').forEach(e=>e.remove())}
/* confetti */
function burst(color){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:110},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-3,s:4+Math.random()*7,r:Math.random()*6,c:[color,'#fff','#ffc24b','#ff4fa3','#4ad7ff'][Math.random()*5|0]}));
  let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<100)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
/* CASES */
let _ca=0;
const TH=[['#4ad7ff','#1b57e6','#ffd36b'],['#ff6fb5','#a21e86','#ffe9a3'],['#a58bff','#4a2fd0','#ffd36b'],['#4be3a4','#0e8456','#fff3b0'],['#ffc24b','#c65f12','#ff5fa8'],['#ff8a55','#b3331a','#ffe9a3'],['#5ee7ff','#6a4cff','#ff9ad5'],['#7fd0ff','#1c4fa8','#e6f6ff'],['#ff8a2b','#5a1f9e','#b6f04a'],['#ff6b88','#a3234e','#ffe0b0'],['#ffa3d1','#b02f7a','#fff0f5'],['#7df3ff','#2563eb','#ffffff'],['#ffd84a','#a8700a','#ff7a45'],['#ff6a3d','#a01212','#ffd36b'],['#c58bff','#5a1f9e','#ffcf6b'],['#3ddc84','#0a6a42','#e8ff9a'],['#7d8bff','#1a1f6e','#7cf2ff']];
const PAL={'Мини':0,'Малыш':1,'Стартовый':2,'Сюрприз':3,'Золотой':4,'Подарок мечты':5,'Праздничный':6,'Новогодний':7,'Хэллоуин':8,'Любовь':9,'Сакура':10,'Алмазный':11,'Премиум':12,'Огненный':13,'Легенда':14,'Миллионер':15,'Космос':16};
const palOf=(c,i)=>TH[PAL[c.name.split(' ').slice(1).join(' ')]??i%TH.length];
const caseList=()=>Object.entries(C.cases).sort((a,b)=>a[1].price-b[1].price);
const caseIdx=id=>caseList().findIndex(e=>e[0]===id);
function caseArt(i,emo,cls=''){
  const t=TH[i%TH.length],g='g'+(++_ca);
  const sp=[[16,34,0],[104,26,.5],[100,76,1.1],[20,82,1.6],[60,9,.8]].map(([x,y,d])=>`<path class="sp" style="animation-delay:${d}s" d="M${x} ${y-7}Q${x} ${y} ${x+7} ${y}Q${x} ${y} ${x} ${y+7}Q${x} ${y} ${x-7} ${y}Q${x} ${y} ${x} ${y-7}Z" fill="#fff"/>`).join('');
  return `<svg class="cart ${cls}" viewBox="0 0 120 120"><defs><radialGradient id="${g}a"><stop offset="0" stop-color="${t[0]}" stop-opacity=".55"/><stop offset="1" stop-color="${t[0]}" stop-opacity="0"/></radialGradient><linearGradient id="${g}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t[0]}"/><stop offset="1" stop-color="${t[1]}"/></linearGradient><linearGradient id="${g}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t[2]}"/><stop offset="1" stop-color="${t[2]}" stop-opacity=".7"/></linearGradient></defs><circle cx="60" cy="62" r="56" fill="url(#${g}a)"/><ellipse cx="60" cy="108" rx="34" ry="5" fill="#000" opacity=".35"/><rect x="24" y="54" width="72" height="52" rx="9" fill="url(#${g}b)"/><rect x="24" y="54" width="20" height="52" rx="9" fill="#fff" opacity=".13"/><rect x="53" y="54" width="14" height="52" fill="url(#${g}c)"/><circle cx="60" cy="84" r="15" fill="#0d0919" opacity=".4"/><text x="60" y="85" text-anchor="middle" dominant-baseline="central" font-size="19">${emo}</text><g class="lid"><rect x="17" y="40" width="86" height="19" rx="7" fill="url(#${g}b)"/><rect x="17" y="40" width="86" height="7" rx="4" fill="#fff" opacity=".22"/><rect x="53" y="40" width="14" height="19" fill="url(#${g}c)"/><path d="M60 40C48 14 27 21 38 36C43 43 54 41 60 40Z" fill="url(#${g}c)"/><path d="M60 40C72 14 93 21 82 36C77 43 66 41 60 40Z" fill="url(#${g}c)"/><circle cx="60" cy="38" r="6.5" fill="${t[2]}"/></g>${sp}</svg>`}
/* арт кейса: главный приз в центре + 4 приза вокруг, свой цвет у каждого кейса */
const ci=d=>{const x=d.k.slice(2);return C.imgs&&C.imgs.includes(x)?`<img class="ci" src="${IMGSRC(x)}" alt="" decoding="async">`:`<span class="ci ce">${d.e}</span>`};
function caseSet(c,seed=0){
  const all=c.drops.map(d=>info(d[0])).filter(d=>d.k[0]==='i').sort((a,b)=>b.v-a.v);
  const img=all.filter(d=>C.imgs&&C.imgs.includes(d.k.slice(2))),pool=img.length>=5?img:all;
  const h=(seed*3)%Math.min(4,pool.length||1),rest=pool.filter((_,k)=>k!==h),n=Math.min(4,rest.length);
  return{hero:pool[h],sat:Array.from({length:n},(_,k)=>rest[Math.floor((((k+.5)/n+seed*.17)%1)*rest.length)]),max:all[0]?all[0].v:0}}
function caseArt2(c,i,big){
  const t=palOf(c,i),{hero,sat,max}=caseSet(c,i);
  return`<div class="cc-art${big?' lg':''}" style="--c1:${t[0]};--c2:${t[1]};--c3:${t[2]}"><i class="cc-rays"></i><i class="cc-glow"></i><i class="cc-stars"></i><span class="cc-tag">до ${nf(max)} ⭐</span>${sat.map((d,k)=>`<div class="cc-it s${k}">${ci(d)}</div>`).join('')}${hero?`<div class="cc-it hero">${ci(hero)}</div>`:''}</div>`}
function vCases(){
  if(sub.case)return vCase(sub.case);
  const fl=S.free_left||0;
  $('#view').innerHTML='<h2 class="fi">Кейсы</h2><div class="card fi" style="margin-bottom:14px;text-align:center"><div style="font-size:34px">🎁</div><div class="d" style="font-size:16px;margin:4px 0">Бесплатный кейс</div><p class="mu" style="margin:0 0 10px">Раз в 24 часа</p><button class="btn '+(fl?'ghost dis':'gold')+'" onclick="openFree()">'+(fl?'Откроется через '+fmt(fl):'Открыть бесплатно')+'</button></div><div class="grid g2">'+caseList().map(([id,c],i)=>{const n=c.name.split(' ').slice(1),t=palOf(c,i);
    return`<div class="case cc fi" style="--gl:${t[0]};--c1:${t[0]};--i:${i+1}" onclick="sub.case='${id}';render()">${caseArt2(c,i)}<div class="cc-foot"><div class="nm">${n.join(' ')}</div><div class="pr">${nf(c.price)} ⭐</div></div></div>`}).join('')+'</div><p class="mu" style="margin-top:16px;text-align:center">Выбей подарок и забери его себе или продай за звёзды</p>'}
function vCase(id){
  const c=C.cases[id],i=caseIdx(id),[em,...nm]=c.name.split(' '),t=palOf(c,i),nn=curN(),ds=c.drops.map(d=>({...info(d[0]),p:d[1]})).sort((a,b)=>b.v-a.v);
  $('#view').innerHTML=`<button class="mu" onclick="sub={};render()">← Все кейсы</button>
  <div class="stage cc2" style="--gl:${t[0]}">${caseArt2(c,i,true)}<h2 class="d">${nm.join(' ')}</h2><div class="badges"><span class="bd">${nf(c.price)} ⭐</span></div></div>
  <div class="nsel fi" style="--i:7">${NS.map(k=>`<button class="${k===nn?'on':''}" onclick="setN('${id}',${k},this)">${k}<small>${NW(k)}</small></button>`).join('')}</div>
  <div class="npv" id="npv">${nPrev(em,nn)}</div>
  <button class="btn gold fi" style="--i:8;margin-bottom:12px" id="obtn" data-p="${c.price*nn}" onclick="openCase('${id}',curN())"><span id="olab">Открыть${nn>1?' ×'+nn:''}</span> · <span id="opr">${nf(c.price*nn)}</span> ⭐</button>
  <div class="qfw fi" style="--i:9"><button class="qf ${isFast()?'on':''}" onclick="toggleFast(this)"><i></i>⚡ Крутить быстро</button></div>
  <h3 class="fi" style="--i:12">Что внутри</h3><div class="grid g3">${ds.map((d,k)=>`<div class="fi" style="--i:${13+k}">${tile(d,`<span class="x">${d.p<1?d.p.toFixed(1):d.p.toFixed(0)}%</span>`)}</div>`).join('')}</div>`}
const NS=[1,2,3,4,5,10],NW=n=>n===1?'кейс':n<5?'кейса':'кейсов';
const curN=()=>{const v=+localStorage.caseN;return NS.includes(v)?v:1};
const nPrev=(em,n)=>Array.from({length:n},(_,k)=>`<span style="--k:${k}">${em}</span>`).join('');
function setN(id,n,el){
  if(busy)return;localStorage.caseN=n;sub.n=n;
  document.querySelectorAll('.nsel button').forEach(b=>b.classList.toggle('on',b===el));
  const c=C.cases[id],em=c.name.split(' ')[0],btn=$('#obtn');
  $('#olab').textContent='Открыть'+(n>1?' ×'+n:'');
  const from=+btn.dataset.p||c.price,to=c.price*n,t0=performance.now();btn.dataset.p=to;
  (function f(){const k=Math.min(1,(performance.now()-t0)/260),e=1-Math.pow(1-k,3);$('#opr').textContent=nf(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f)})();
  btn.classList.remove('bump');void btn.offsetWidth;btn.classList.add('bump');
  $('#npv').innerHTML=nPrev(em,n);hap('light')}
const FREE_POOL=[['s:0',1],['s:1',1],['s:5',1],['s:10',1]]; /* только для вида рулетки, реальные шансы на клиенте не хранятся */
async function openFree(){
  if(busy||S.free_left)return;
  busy=true;let r;try{r=await api('case/free',{},true)}catch(e){busy=false;return}
  if(r.need_sub){busy=false;
    sheet(`<div style="text-align:center"><div style="font-size:46px">📢</div><div class="d" style="font-size:16px;margin:6px 0">Подпишитесь, чтобы открыть кейс</div><p class="mu">Подпишитесь на каналы и нажмите «Проверить»</p></div><div class="grid" style="margin-top:16px">${r.need_sub.map(c=>`<button class="btn ghost" onclick="tg.openTelegramLink?tg.openTelegramLink('${c.url}'):window.open('${c.url}')">📢 ${c.n}</button>`).join('')}<button class="btn gold" onclick="closeSheet();openFree()">✅ Проверить</button></div>`);return}
  const d=info(r.free);
  await spin('free',d,'🎁 Бесплатный кейс');await reveal([d]);
  paintBal();busy=false;render()}
async function openCase(id,n){
  if(busy)return;n=n||1;const c=C.cases[id];
  if(S.u.balance<c.price*n){toast(n>1?`Для ×${n} нужно ${nf(c.price*n)} ⭐`:'Недостаточно звёзд — пополните баланс','err');hn('error');return}
  busy=true;let r;try{r=await api('case',{cid:id,n},true)}catch(e){busy=false;return}
  const ds=r.drops.map(info);
  if(ds.length>1)await multiSpin(id,ds,c.name);
  else{const best=ds.reduce((a,b)=>b.v>a.v?b:a);await playAnim(id,best,c.name);await reveal(ds)}
  paintBal();try{await api('feed/reveal',{},false,true)}catch(e){}busy=false;render();lfPoll()}
/* МУЛЬТИ-ОТКРЫТИЕ: на каждый кейс своя рулетка, все крутятся одновременно */
async function multiSpin(id,ds,title){
  const n=ds.length,pool=C.cases[id].drops,tot=pool.reduce((a,d)=>a+d[1],0),T=n>=6?18:n>=3?24:34,N=T+8,GAP=6; /* чем больше рулеток, тем короче лента: иначе Android не хватает видеопамяти и часть рядов пропадает */
  const pick=()=>{let r=Math.random()*tot;for(const d of pool){if((r-=d[1])<0)return info(d[0])}return info(pool[0][0])};
  const cs=getComputedStyle(document.documentElement),cc={};const col=d=>cc[d.r]||(cc[d.r]=cs.getPropertyValue(RC[d.r]).trim());
  const rh=Math.max(48,Math.min(112,Math.floor((innerHeight-150-(n-1)*6)/n))),tw=rh<70?rh:Math.round(rh*.94),stride=tw+GAP;
  const bi=ds.reduce((m,d,i)=>d.v>ds[m].v?i:m,0);
  const rows=ds.map((w,i)=>{const cards=Array.from({length:N},(_,k)=>k===T?w:pick());
    return`<div class="mrow" style="--rc:${col(w)};--i:${i}"><div class="mark"></div><div class="strip">${cards.map((d,k)=>tile(d,'',k===T?'hit':'')).join('')}</div></div>`}).join('');
  const o=document.createElement('div');o.className='ov mo '+(rh<66?'m-s':rh<100?'m-m':'m-l');
  o.style.setProperty('--rh',rh+'px');o.style.setProperty('--tw',tw+'px');
  o.innerHTML=`<div class="ovt">${title}<span class="mx">×${n}</span><div class="mprog"><i></i></div></div><div class="mlist">${rows}</div><div class="mfoot"><div class="msum mu">Открываем…</div></div>`;
  document.body.appendChild(o);
  const strips=[...o.querySelectorAll('.strip')],rowEl=[...o.querySelectorAll('.mrow')],mp=o.querySelector('.mprog i'),mf=o.querySelector('.mfoot');
  await Promise.race([Promise.all([...o.querySelectorAll('img')].map(im=>im.decode?im.decode().catch(()=>0):0)),sleep(800)]);
  await sleep(isFast()?80:300+n*45);
  const F=isFast(),dur=i=>F?1.4+i*.05:5.4+i*.13,sx=innerWidth/2;let done=0,fin=false;
  strips.forEach(st=>{st.style.transform='translate3d(0,0,0)'});strips[0].getBoundingClientRect();
  const ends=strips.map((st,i)=>{
    const off=(Math.random()-.5)*tw*.7,tx=sx-(T*stride+tw/2+off);rowEl[i].style.setProperty('--wo',(-off).toFixed(1)+'px');
    st.style.transition=`transform ${dur(i)}s cubic-bezier(.08,.62,.12,1)`;st.style.transform=`translate3d(${tx}px,0,0)`;
    return new Promise(res=>{let d=false;const f=()=>{if(d)return;d=true;res()};st.addEventListener('transitionend',e=>{if(e.target===st)f()});setTimeout(f,dur(i)*1000+300)}).then(()=>{
      rowEl[i].classList.add('stop');if(i===bi)rowEl[i].insertAdjacentHTML('beforeend','<i class="mtag">🔥</i>');
      mp.style.transform=`scaleX(${++done/n})`;hap(ds[i].r>=3?'heavy':'light')})});
  let last=-1;const t0=performance.now(),T1=(dur(n-1)+.3)*1000;
  (function tick(){const m=new DOMMatrix(getComputedStyle(strips[0]).transform).m41,k=Math.floor((sx-m)/stride);
    if(k!==last){last=k;if(!window.UI||UI.hap)try{tg.HapticFeedback.selectionChanged()}catch(e){}}
    if(!fin&&performance.now()-t0<T1)requestAnimationFrame(tick)})();
  await Promise.all(ends);fin=true;
  const best=ds[bi],sum=ds.reduce((a,d)=>a+d.v,0);
  mf.innerHTML=`<div class="msum"><span class="mu">Итого</span> <b class="d" id="mtot">0</b> ⭐<small class="mu">лучший: ${best.n}</small></div><button class="btn gold" id="mk">Забрать</button>`;
  const te=mf.querySelector('#mtot'),tt=performance.now();(function f(){const k=Math.min(1,(performance.now()-tt)/900);te.textContent=nf(Math.round(sum*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})();
  hn(best.r>=3?'success':'warning');if(best.r>=2)burst(col(best));if(best.r>=4)setTimeout(()=>burst(col(best)),500);

let lfTop=0,lfSeen=new Set();
function lfRender(f){
  const el=$('#lf');if(!el)return;if(window.UI&&!UI.live){el.hidden=true;return}
  if(!f.length){el.hidden=false;el.innerHTML='<span class="lb">LIVE</span><span class="le">Здесь появятся дропы игроков</span>';return}
  if(f[0].id===lfTop)return;
  const first=!lfTop;lfTop=f[0].id;
  el.hidden=false;
  el.innerHTML='<span class="lb">LIVE</span><div class="ls">'+f.map(x=>{const d=info(x.k);
    return`<div class="lc2${!first&&!lfSeen.has(x.id)?' nw':''}${x.me?' me':''}" style="--rc:var(${RC[d.r]})"><span class="li">${gi(d.k,d.e)}</span><span class="lt"><b>${d.n}</b><small>${x.me?'Вы':x.u}${x.c?' · '+x.c.split(' ').slice(1).join(' '):''}</small></span></div>`}).join('')+'</div>';
  f.forEach(x=>lfSeen.add(x.id))}
async function lfPoll(){
  if(busy||document.hidden||!C||(window.UI&&!UI.live))return; /* пока идёт открытие кейса — лента заморожена, чтобы не спойлерить */
  try{const r=await api('feed',{},false,true);if(!busy)lfRender(r.feed||[])}catch(e){}}
setInterval(lfPoll,7000);
(async()=>{try{await api('me');paint();render();lfPoll()}catch(e){$('#view').innerHTML='<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:48px">🔌</div><p class="mu" style="margin-top:10px">Откройте приложение через бота @Oskegcase</p></div>'}})();
</script>

<script id="uiplus-js">
/* ================= UI+ : плавность, фоны, свайпы, настройки ================= */
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const weak=(navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=3;
const DEF={th:'violet',bg:'aurora',view:'grid',q:'low',tilt:1,trail:1,swipe:1,hap:1,conf:1,snd:0,live:1};
let U;try{U=Object.assign({},DEF,JSON.parse(localStorage.ui||'{}'))}catch(e){U=Object.assign({},DEF)}
if(U.pf!==3){U.pf=3;U.th='violet';U.view='grid';U.trail=0;U.tilt=0;try{localStorage.ui=JSON.stringify(U)}catch(e){}}
U.q='low';
window.UI=U;
const save=()=>{try{localStorage.ui=JSON.stringify(U)}catch(e){}};
const HEX={violet:'#120a2a',neon:'#0d0919',sunset:'#140a10',ocean:'#06101d',emerald:'#051410',sakura:'#190a14',royal:'#110d05',amoled:'#000000'};
const THEMES=[['violet','Фиолет','#8b5cf6','#c084fc'],['neon','Неон','#9b7bff','#ff4fa3'],['sunset','Закат','#ff8a3d','#ff4f7b'],['ocean','Океан','#4a8dff','#22d3ee'],['emerald','Изумруд','#1fbf8f','#a3e635'],['sakura','Сакура','#ff7eb6','#ffd1e8'],['royal','Золото','#e0b030','#ff9d3d'],['amoled','Чёрный','#6b6b7a','#26262e']];
const BGS=[['aurora','🌌','Аврора'],['stars','✨','Звёзды'],['gifts','🎁','Подарки'],['grid','🕹️','Сетка'],['none','◻️','Нет']];
const QS=[['high','🚀','Макс'],['mid','⚖️','Баланс'],['low','🔋','Эконом']];
const GCH=['🎁','⭐','💎','✨','🎀','🪙','💖'];
const lowQ=()=>reduce||U.q==='low';
let scrolling=false,scT=0;
const hapT=t=>{if(U.hap)try{tg.HapticFeedback.selectionChanged()}catch(e){}};
let cols=['#9b7bff','#ff4fa3','#ffc24b','#4ad7ff'];

/* ---------- звуки (по желанию) ---------- */
let AC;
function tone(f,d,type,v,at){if(!U.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SND={tap:()=>tone(520,.05,'triangle',.035),nav:()=>{tone(440,.07,'sine',.05);tone(660,.09,'sine',.04,.05)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.06,i*.08)),on:()=>{tone(600,.06,'sine',.05);tone(900,.08,'sine',.04,.05)}};

/* ---------- каркас: фон, прогресс, шестерёнка, пилюля навбара ---------- */
const bgw=document.createElement('div');bgw.id='bgw';
bgw.innerHTML='<i class="aur a1"></i><i class="aur a2"></i><i class="aur a3"></i><div class="sgw"><div class="sgrid"></div></div><div class="vig"></div>';
document.body.prepend(bgw);
const bgc=document.createElement('canvas');bgc.id='bgc';document.body.insertBefore(bgc,bgw.nextSibling);
const tcv=document.createElement('canvas');tcv.id='trail';document.body.appendChild(tcv);

document.body.insertAdjacentHTML('beforeend','<div class="swh" id="swl"></div><div class="swh" id="swr"></div>');
const hdr=$('header'),bal=$('#bal');
const hr=document.createElement('div');hr.className='hr';bal.parentNode.insertBefore(hr,bal);
hr.appendChild(bal);
$('#nav').insertAdjacentHTML('afterbegin','<i class="pill"></i>');

/* ---------- фоновый canvas: звёзды / подарки ---------- */
const bx=bgc.getContext('2d');
let W=0,HH=0,DPR=1,items=[],raf=0,lastT=0,shoot=null,nextShoot=0;
const SPR={};
function sprite(ch){if(SPR[ch])return SPR[ch];const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.font='44px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,32,36);return SPR[ch]=c}
function bgSize(){DPR=Math.min(devicePixelRatio||1,U.q==='high'?1.5:1);W=innerWidth;HH=innerHeight;bgc.width=Math.round(W*DPR);bgc.height=Math.round(HH*DPR);bx.setTransform(DPR,0,0,DPR,0,0)}
function mk(init){
  if(U.bg==='stars')return{x:rnd(0,W),y:rnd(0,HH),r:rnd(.5,1.8),ph:rnd(0,6.28),sp:rnd(.8,2.4),d:rnd(.25,1),t:Math.random()<.3};
  return{x:rnd(0,W),y:init?rnd(0,HH):HH+60,s:rnd(.55,1.05),v:rnd(10,26),ph:rnd(0,6.28),ch:pick(GCH),rot:rnd(-.5,.5),a:rnd(.15,.32)}}
function bgInit(){
  cancelAnimationFrame(raf);raf=0;bx.setTransform(1,0,0,1,0,0);bx.clearRect(0,0,bgc.width,bgc.height);
  const on=(U.bg==='stars'||U.bg==='gifts')&&!lowQ();bgc.style.display=on?'block':'none';if(!on)return;
  bgSize();const n=U.bg==='stars'?(U.q==='high'?85:42):(U.q==='high'?16:9);
  items=Array.from({length:n},()=>mk(true));lastT=performance.now();nextShoot=lastT+3000;raf=requestAnimationFrame(bgLoop)}
function bgLoop(t){
  raf=requestAnimationFrame(bgLoop);if(document.hidden||scrolling)return;
  const dt=t-lastT;if(dt<(U.q==='high'?22:33))return;lastT=t;const s=Math.min(dt,80)/1000,sy=scrollY;
  bx.clearRect(0,0,W,HH);
  if(U.bg==='stars'){
    for(const p of items){bx.globalAlpha=(.25+.75*(.5+.5*Math.sin(t/1000*p.sp+p.ph)))*p.d;bx.fillStyle=p.t?cols[3]:'#fff';
      let y=(p.y-sy*p.d*.12)%HH;if(y<0)y+=HH;bx.beginPath();bx.arc(p.x,y,p.r,0,6.283);bx.fill()}
    if(!shoot&&t>nextShoot){shoot={x:rnd(W*.4,W),y:rnd(0,HH*.35),k:0};nextShoot=t+rnd(4500,9000)}
    if(shoot){shoot.k+=s*1.4;const x=shoot.x-shoot.k*W*.6,y=shoot.y+shoot.k*W*.3,g=bx.createLinearGradient(x,y,x+80,y-40);
      g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');bx.globalAlpha=Math.max(0,1-shoot.k);bx.strokeStyle=g;bx.lineWidth=2;bx.beginPath();bx.moveTo(x,y);bx.lineTo(x+80,y-40);bx.stroke();if(shoot.k>1)shoot=null}
  }else{
    for(const p of items){p.y-=p.v*s;p.x+=Math.sin(t/1800+p.ph)*.25;if(p.y<-60)Object.assign(p,mk(false));
      bx.globalAlpha=p.a;const z=38*p.s;bx.save();bx.translate(p.x,p.y);bx.rotate(p.rot+Math.sin(t/1500+p.ph)*.25);bx.drawImage(sprite(p.ch),-z/2,-z/2,z,z);bx.restore()}
  }
  bx.globalAlpha=1}
document.addEventListener('visibilitychange',()=>{lastT=performance.now()});

/* ---------- искры от пальца ---------- */
const tx=tcv.getContext('2d');let sp=[],tr=0,tl=0,lastSpark=0;
function sizeTrail(){tcv.width=innerWidth;tcv.height=innerHeight}
function spark(x,y,n){
  if(!U.trail||lowQ())return;for(let i=0;i<n;i++)sp.push({x,y,vx:rnd(-1.4,1.4),vy:rnd(-2,.4),l:1,s:rnd(2,4.6),c:pick(cols)});
  if(sp.length>100)sp.splice(0,sp.length-100);if(!tr){tl=performance.now();tr=requestAnimationFrame(tstep)}}
function tstep(t){
  const f=Math.min(2.2,(t-tl)/16.67||1);tl=t;tx.clearRect(0,0,tcv.width,tcv.height);
  sp=sp.filter(p=>(p.l-=.03*f)>0);
  for(const p of sp){p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=.05*f;tx.globalAlpha=p.l;tx.fillStyle=p.c;
    tx.save();tx.translate(p.x,p.y);tx.rotate(p.l*3);const r=p.s*p.l+.6;tx.beginPath();tx.moveTo(0,-r*1.6);tx.lineTo(r*.4,-r*.4);tx.lineTo(r*1.6,0);tx.lineTo(r*.4,r*.4);tx.lineTo(0,r*1.6);tx.lineTo(-r*.4,r*.4);tx.lineTo(-r*1.6,0);tx.lineTo(-r*.4,-r*.4);tx.closePath();tx.fill();tx.restore()}
  tx.globalAlpha=1;
  if(sp.length)tr=requestAnimationFrame(tstep);else{tr=0;tx.clearRect(0,0,tcv.width,tcv.height)}}
addEventListener('touchmove',e=>{const n=performance.now();if(scrolling||n-lastSpark<30||document.querySelector('.sheet,.ov'))return;lastSpark=n;const t=e.touches[0];spark(t.clientX,t.clientY,U.q==='high'?2:1)},{passive:true});

/* ---------- ripple + искры по тапу ---------- */
const RSEL='.btn,.chip,.cell,.tt,.tabs button,.gear,.seg button,.case,.it';
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest(RSEL);if(!el||el.classList.contains('dis'))return;
  const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,i=document.createElement('i');i.className='rip';
  i.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;width:${d}px;height:${d}px`;
  el.appendChild(i);setTimeout(()=>i.remove(),700);
  if(el.matches('.btn,.chip,.case'))spark(e.clientX,e.clientY,5);
  SND.tap()},{passive:true});

/* ---------- тема ---------- */
function readCols(){const cs=getComputedStyle(H),g=n=>cs.getPropertyValue(n).trim();cols=[g('--vi'),g('--pink'),g('--gold'),g('--cy')].map((c,i)=>c||cols[i])}
function apply(){
  H.dataset.th=U.th;H.dataset.bg=U.bg;H.dataset.q=lowQ()?'low':U.q;
  try{tg.setHeaderColor(HEX[U.th]);tg.setBackgroundColor(HEX[U.th])}catch(e){}
  readCols();bgInit();sizeTrail();pill()}
function themeSwitch(x,y){
  if(!document.startViewTransition||lowQ()){apply();return}
  H.classList.add('vt');let t;
  try{t=document.startViewTransition(()=>{apply();syncSheet()})}catch(e){apply();H.classList.remove('vt');return}
  t.ready.then(()=>{const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    H.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'})}).catch(()=>{});
  t.finished.finally(()=>H.classList.remove('vt'))}

/* ---------- нижняя панель: пилюля ---------- */
function pill(){const on=$('#nav button.on'),p=$('#nav .pill');if(!on||!p)return;p.style.width=on.offsetWidth+'px';p.style.transform=`translateX(${on.offsetLeft}px)`;p.style.opacity=1}
addEventListener('resize',()=>{pill();sizeTrail();if(raf)bgInit()});
addEventListener('load',pill);

/* ---------- обёртки над оригинальными функциями ---------- */
const _paint=window.paint;window.paint=function(){_paint();pill()};
const _go=window.go;
window.go=function(t){
  if(!busy&&t===tab&&!depth()&&scrollY>40){scrollTo({top:0,behavior:'smooth'});hap();return}
  SND.nav();_go(t)};
const _sheet=window.sheet;window.sheet=function(h){_sheet('<div class="grab"></div>'+h)};
let first=true;
const _pb=window.paintBal;
window.paintBal=function(){
  const before=shown;_pb();
  try{const d=S.u.balance-before;if(first){first=false;return}
    if(d){const b=$('#bal');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
      $$('.dlt').forEach(x=>x.remove());const e=document.createElement('div');e.className='dlt '+(d>0?'up':'dn');e.textContent=(d>0?'+':'−')+nf(Math.abs(d));b.appendChild(e);setTimeout(()=>e.remove(),1600)}}catch(e){}};

const depth=()=>(sub&&(sub.case||sub.game||sub.mode))?1:0;
const tidx=t=>TABS.findIndex(x=>x[0]===t);
let lastTab=null,lastDepth=0;
function mkGhost(v){
  const r=v.getBoundingClientRect(),g=v.cloneNode(true);g.removeAttribute('id');g.className='vghost';
  g.style.cssText=`top:${r.top+scrollY}px;left:${r.left}px;width:${r.width}px`;return g}
const _render=window.render;
window.render=function(){
  const v=$('#view');let ghost=null;
  _render();
  const d=depth();let cls='vin-u';
  if(lastTab&&tab!==lastTab)cls=tidx(tab)>tidx(lastTab)?'vin-r':'vin-l';
  else if(d>lastDepth)cls='vin-z';else if(d<lastDepth)cls='vin-b';
  lastTab=tab;lastDepth=d;
  v.classList.remove('vin-r','vin-l','vin-z','vin-b','vin-u');void v.offsetWidth;v.classList.add(cls);
  if(ghost){
    ghost.style.setProperty('--gx',cls==='vin-r'?'-30px':cls==='vin-l'?'30px':'0px');
    ghost.style.setProperty('--gs',cls==='vin-z'?'1.06':cls==='vin-b'?'.94':'1');
    document.body.appendChild(ghost);setTimeout(()=>ghost.remove(),420)}
  try{post()}catch(e){console.error(e)}
  scrollTick()};

/* ---------- обработка новой отрисовки ---------- */
let io=null;const vis=new Set();let curIdx=0;
function post(){
  $$('#view .case').forEach(el=>{el.classList.remove('fi');el.classList.add('rv');if(!el.querySelector('.glare'))el.insertAdjacentHTML('beforeend','<i class="glare"></i>')});
  if(tab==='cases'&&!sub.case)casesUI();
  observe()}
function observe(){
  if(io)io.disconnect();vis.clear();const els=$$('#view .case');
  if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in','vis'));return}
  io=new IntersectionObserver(es=>{
    es.sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top||a.boundingClientRect.left-b.boundingClientRect.left);let k=0;
    for(const en of es){const el=en.target;el.classList.toggle('vis',en.isIntersecting);
      if(en.isIntersecting){vis.add(el);
        if(el.classList.contains('rv')&&!el.classList.contains('in')){el.style.setProperty('--d',Math.min(k++,8));el.classList.add('in');
          setTimeout(()=>{el.classList.add('done');el.style.removeProperty('--d')},950)}
      }else vis.delete(el)}
  },{rootMargin:'60px 0px 60px 0px',threshold:.01});
  els.forEach(e=>io.observe(e))}

/* ---------- кейсы: переключатель вида и карусель ---------- */
function casesUI(){
  const h=$('#view>h2');if(!h)return;
  const row=document.createElement('div');row.className='ch';h.replaceWith(row);row.appendChild(h);
  row.insertAdjacentHTML('beforeend',`<div class="seg"><button data-v="grid" class="${U.view==='grid'?'on':''}">▦</button><button data-v="car" class="${U.view==='car'?'on':''}">◉</button></div>`);
  row.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===U.view)return;U.view=b.dataset.v;save();hap();SND.tap();render()};
  if(U.view==='car')carousel()}
function carousel(){
  const g=$('#view .grid.g2');if(!g)return;g.classList.add('cars');
  const cards=[...g.children];cards.forEach(c=>{c.classList.remove('rv');c.classList.add('in','done')});
  const ids=cards.map(c=>((c.getAttribute('onclick')||'').match(/'([^']+)'/)||[])[1]);
  const info=document.createElement('div');info.className='cinfo';
  info.innerHTML=`<div class="cdots">${cards.map(()=>'<i></i>').join('')}</div><button class="btn gold cta"></button>`;g.after(info);
  const dots=[...info.querySelectorAll('i')],cta=info.querySelector('.cta');let cur=-1,pend=false;
  function upd(){
    const cr=g.getBoundingClientRect(),mid=cr.left+cr.width/2;let bi=0,bd=1e9;
    cards.forEach((el,i)=>{const r=el.getBoundingClientRect(),d=r.left+r.width/2-mid,a=Math.min(1,Math.abs(d)/(cr.width*.5));
      el.style.setProperty('--s',(1-a*.22).toFixed(3));el.style.setProperty('--o',(1-a*.55).toFixed(2));el.style.setProperty('--ry',((d<0?1:-1)*a*28).toFixed(1)+'deg');
      if(Math.abs(d)<bd){bd=Math.abs(d);bi=i}});
    if(bi!==cur){cur=bi;curIdx=bi;dots.forEach((x,i)=>x.classList.toggle('on',i===bi));cards.forEach((x,i)=>x.classList.toggle('cur',i===bi));
      const c=C.cases[ids[bi]];if(c)cta.textContent='Открыть · '+c.name.split(' ').slice(1).join(' ')+' · '+nf(c.price)+' ⭐';
      if(cur>=0&&first===false)hapT()}}
  g.addEventListener('scroll',()=>{if(!pend){pend=true;requestAnimationFrame(()=>{pend=false;upd()})}},{passive:true});
  cta.onclick=()=>cards[cur]&&cards[cur].click();
  g.addEventListener('click',e=>{const c=e.target.closest('.case');if(!c)return;const i=cards.indexOf(c);
    if(i!==cur){e.stopPropagation();e.preventDefault();g.scrollTo({left:c.offsetLeft-(g.clientWidth-c.offsetWidth)/2,behavior:'smooth'})}},true);
  requestAnimationFrame(()=>{const c=cards[Math.min(curIdx,cards.length-1)];if(c)g.scrollLeft=c.offsetLeft-(g.clientWidth-c.offsetWidth)/2;upd()})}

/* ---------- скролл: шапка, прогресс, параллакс ---------- */
let tick=false;
function scrollTick(){if(tick)return;tick=true;requestAnimationFrame(onScroll)}
function onScroll(){
  tick=false;const y=scrollY,max=H.scrollHeight-innerHeight;
  hdr.classList.toggle('stuck',y>8);
  }
let rot=0;
setInterval(()=>{if(document.hidden||scrolling||reduce||U.q==='low'||tab!=='cases'||sub.case||document.querySelector('.ov,.sheet,.reveal'))return;
  const v=[...vis].filter(e=>e.isConnected&&!e.closest('.cars'));if(!v.length)return;
  const el=v[rot++%v.length];el.classList.add('shn','wink');setTimeout(()=>el.classList.remove('shn','wink'),1500)},1700);
addEventListener('scroll',()=>{if(!scrolling){scrolling=true;H.classList.add('scrolling')}clearTimeout(scT);scT=setTimeout(()=>{scrolling=false;H.classList.remove('scrolling')},150);scrollTick()},{passive:true});

/* ---------- 3D-наклон карточек ---------- */
let tc=null,trc=null;
function tiltOff(){if(!tc)return;tc.style.transition='transform .45s '+getComputedStyle(H).getPropertyValue('--spring');tc.style.transform='';tc.classList.remove('tilting');const c=tc;setTimeout(()=>{c.style.transition=''},480);tc=null}
function tiltTo(c,x,y){
  const r=trc,px=(x-r.left)/r.width,py=(y-r.top)/r.height;
  c.style.transform=`perspective(700px) rotateX(${((.5-py)*18).toFixed(1)}deg) rotateY(${((px-.5)*18).toFixed(1)}deg) scale(1.03)`;
  c.style.setProperty('--gx',(px*100)+'%');c.style.setProperty('--gy',(py*100)+'%')}
let ttm=0,tlx=0,tly=0,tsx=0,tsy=0;
document.addEventListener('touchstart',e=>{
  clearTimeout(ttm);if(!U.tilt||U.q!=='high'||e.touches.length!==1)return;
  const c=e.target.closest&&e.target.closest('.case');if(!c||c.closest('.cars'))return;
  tsx=tlx=e.touches[0].clientX;tsy=tly=e.touches[0].clientY;
  ttm=setTimeout(()=>{if(scrolling)return;tc=c;trc=c.getBoundingClientRect();c.style.transition='transform .12s ease-out';c.classList.add('tilting');tiltTo(c,tlx,tly)},110)},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];tlx=t.clientX;tly=t.clientY;
  if(!tc){if(Math.hypot(tlx-tsx,tly-tsy)>7)clearTimeout(ttm);return}
  if(t.clientX<trc.left-8||t.clientX>trc.right+8||t.clientY<trc.top-8||t.clientY>trc.bottom+8){tiltOff();return}
  tc.style.transition='transform .06s linear';tiltTo(tc,t.clientX,t.clientY)},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(ttm);tiltOff()},{passive:true});document.addEventListener('touchcancel',()=>{clearTimeout(ttm);tiltOff()},{passive:true});

/* ---------- свайпы: вкладки / назад ---------- */
let sx=0,sy=0,st=0,lock=null,sw=false,sdx=0;
const swl=$('#swl'),swr=$('#swr');
function horizScroller(el){while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+4){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true}el=el.parentElement}return false}
function swipeTargets(){
  if(sub&&(sub.game||sub.mode))return null;
  if(sub&&sub.case)return{prev:{icon:'←',fn:()=>{sub={};render()}},next:null};
  const i=tidx(tab),p=TABS[i-1],n=TABS[i+1];
  return{prev:p?{icon:p[1],fn:()=>go(p[0])}:null,next:n?{icon:n[1],fn:()=>go(n[0])}:null}}
document.addEventListener('touchstart',e=>{
  sw=false;if(!U.swipe||e.touches.length!==1||busy||document.querySelector('.ov,.reveal,.sheet'))return;
  const t=e.target;if(t.closest('input,textarea,select,canvas,.reel,.win,.road,.hist,.cars,[data-noswipe]')||horizScroller(t))return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=performance.now();lock=null;sdx=0;sw=true},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(lock===null&&(Math.abs(dx)>12||Math.abs(dy)>12))lock=Math.abs(dx)>Math.abs(dy)*1.5?'x':'y';
  if(lock!=='x')return;const tg2=swipeTargets();if(!tg2){sw=false;return}
  sdx=dx;const v=$('#view'),side=dx>0?tg2.prev:tg2.next,k=Math.min(1,Math.abs(dx)/90);
  v.style.transition='none';v.style.transform=`translate3d(${dx*(side?.5:.18)}px,0,0)`;v.style.opacity=1-Math.min(.45,Math.abs(dx)/420);
  const el=dx>0?swl:swr,oth=dx>0?swr:swl;oth.style.opacity=0;
  if(side){el.textContent=side.icon;el.style.opacity=k;el.style.transform=`scale(${.55+.45*k})`;el.style.borderColor=k>=1?'var(--gold)':'var(--line)'}else el.style.opacity=0},{passive:true});
function swEnd(){
  if(!sw)return;sw=false;if(lock!=='x')return;
  const v=$('#view'),dx=sdx,fast=Math.abs(dx)/(performance.now()-st)>.55,tg2=swipeTargets();
  swl.style.opacity=swr.style.opacity=0;
  v.style.transition='transform .35s '+getComputedStyle(H).getPropertyValue('--spring')+',opacity .3s';v.style.transform='';v.style.opacity='';
  setTimeout(()=>{v.style.transition=''},380);
  if(!tg2||(Math.abs(dx)<80&&!(fast&&Math.abs(dx)>40)))return;
  const side=dx>0?tg2.prev:tg2.next;if(side){hap('medium');side.fn()}}
document.addEventListener('touchend',swEnd,{passive:true});document.addEventListener('touchcancel',swEnd,{passive:true});

/* ---------- свайп вниз закрывает sheet ---------- */
let shp=null,shy=0,shd=0,shok=false;
document.addEventListener('touchstart',e=>{
  const p=e.target.closest&&e.target.closest('.sheet>div');if(!p){shp=null;return}
  const sc=e.target.closest('.set');shok=!sc||sc.scrollTop<=0||!!e.target.closest('.grab');
  shp=p;shy=e.touches[0].clientY;shd=0;p.style.transition='none'},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!shp||!shok)return;const dy=e.touches[0].clientY-shy;if(dy<=0){shd=0;shp.style.transform='';return}
  shd=dy;shp.style.transform=`translate3d(0,${dy}px,0)`;shp.parentNode.style.background=`rgba(0,0,0,${Math.max(0,.6-dy/700)})`},{passive:true});
function shEnd(){
  if(!shp)return;const p=shp,d=shd;shp=null;
  if(d>110){p.style.transition='transform .25s ease-in';p.style.transform='translate3d(0,105%,0)';p.parentNode.style.transition='background .25s';p.parentNode.style.background='rgba(0,0,0,0)';hap();setTimeout(closeSheet,230)}
  else{p.style.transition='transform .4s '+getComputedStyle(H).getPropertyValue('--spring');p.style.transform='';p.parentNode.style.background=''}}
document.addEventListener('touchend',shEnd,{passive:true});document.addEventListener('touchcancel',shEnd,{passive:true});

/* ---------- конфетти нового поколения ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let FP=[],fr=0,fl=0;
function star5(x,r){x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill()}
window.burst=function(color){
  if(!U.conf)return;
  if(fx.width!==innerWidth||fx.height!==innerHeight){fx.width=innerWidth;fx.height=innerHeight}
  const n=lowQ()?40:U.q==='mid'?80:130,pal=[color,'#fff',cols[2],cols[1],cols[3]];
  const add=(x,y,ang,spread,pw,cnt)=>{for(let i=0;i<cnt;i++){const a=ang+rnd(-spread/2,spread/2),v=rnd(pw[0],pw[1]);
    FP.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:rnd(6,12),r:rnd(0,6.28),vr:rnd(-.3,.3),c:pick(pal),sh:pick([0,1,2]),l:0,life:rnd(110,175)})}};
  add(innerWidth/2,innerHeight*.52,-Math.PI/2,Math.PI*1.15,[8,21],n*.6|0);
  if(!lowQ()){add(0,innerHeight,-Math.PI/4,.7,[15,27],n*.2|0);add(innerWidth,innerHeight,-Math.PI*3/4,.7,[15,27],n*.2|0)}
  const f=document.createElement('div');f.className='flash';f.style.setProperty('--rc',color);document.body.appendChild(f);setTimeout(()=>f.remove(),800);
  SND.win();if(!fr){fl=performance.now();fr=requestAnimationFrame(fxLoop)}};
function fxLoop(t){
  const f=Math.min(2.2,(t-fl)/16.67||1);fl=t;fc.clearRect(0,0,fx.width,fx.height);
  FP=FP.filter(p=>(p.l+=f)<p.life);
  for(const p of FP){p.vx*=Math.pow(.985,f);p.vy=p.vy*Math.pow(.985,f)+.38*f;p.x+=p.vx*f;p.y+=p.vy*f;p.r+=p.vr*f;
    const k=p.l/p.life;fc.globalAlpha=k>.7?1-(k-.7)/.3:1;fc.fillStyle=p.c;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);
    if(p.sh===0)fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.sh===1){fc.beginPath();fc.arc(0,0,p.s/3,0,6.283);fc.fill()}else star5(fc,p.s/1.5);fc.restore()}
  fc.globalAlpha=1;if(FP.length)fr=requestAnimationFrame(fxLoop);else{fr=0;fc.clearRect(0,0,fx.width,fx.height)}}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1&&n.classList.contains('reveal')&&!lowQ())
  n.insertAdjacentHTML('afterbegin','<i class="shock"></i><i class="shock s2"></i>'+Array.from({length:12},(_,i)=>`<i class="rsp" style="--a:${i*30}deg;--dl:${(i%4)*.06}s"></i>`).join(''))}).observe(document.body,{childList:true});

/* ---------- настройки ---------- */
const TOG=[['tilt','3D-наклон карточек','Карточки поворачиваются под пальцем'],['trail','Искры от пальца','Волшебный след при касании'],['swipe','Свайпы','Между вкладками и «назад» из кейса'],['hap','Вибрация','Отклик при нажатиях'],['live','Live-лента','Дропы игроков сверху'],['conf','Конфетти','Салют при выигрыше'],['snd','Звуки','Мягкие звуки интерфейса']];
const chip=(k,v,ic,tx)=>`<div class="chip ${U[k]===v?'on':''}" data-k="${k}" data-v="${v}"><b>${ic}</b>${tx}</div>`;
function settingsHTML(){
  return `<div class="set"><div class="d" style="font-size:17px;text-align:center">Оформление</div>
  <h3>Тема</h3><div class="sw">${THEMES.map(t=>`<button class="th ${U.th===t[0]?'on':''}" data-k="th" data-v="${t[0]}" style="--a:${t[2]};--b:${t[3]}">${t[1]}</button>`).join('')}</div>
  <h3>Фон</h3><div class="grid apick">${BGS.map(b=>chip('bg',b[0],b[1],b[2])).join('')}</div>
  <h3>Вид кейсов</h3><div class="grid g2">${chip('view','grid','▦','Сетка')}${chip('view','car','🎠','Лента')}</div>
  <h3>Плавность</h3><div class="grid apick">${QS.map(b=>chip('q',b[0],b[1],b[2])).join('')}</div>
  <h3>Фишки</h3>${TOG.map(t=>`<div class="tg" data-t="${t[0]}"><div>${t[1]}<small>${t[2]}</small></div><div class="tgl ${U[t[0]]?'on':''}"></div></div>`).join('')}
  <button class="btn ghost" style="margin-top:16px" data-reset="1">Сбросить настройки</button></div>`}
function openSettings(){sheet(settingsHTML())}
window.openSettings=openSettings;
function syncSheet(){
  $$('.set [data-k]').forEach(el=>el.classList.toggle('on',U[el.dataset.k]===el.dataset.v));
  $$('.set .tg').forEach(el=>el.querySelector('.tgl').classList.toggle('on',!!U[el.dataset.t]))}
function change(k,v,x,y){
  U[k]=v;save();
  if(k==='th')themeSwitch(x,y);
  else{apply();if(k==='view'&&tab==='cases'&&!sub.case)render()}
  syncSheet()}
document.addEventListener('click',e=>{
  const set=e.target.closest('.set');if(!set)return;
  const k=e.target.closest('[data-k]');
  if(k){hap('medium');SND.tap();change(k.dataset.k,k.dataset.v,e.clientX,e.clientY);return}
  const t=e.target.closest('[data-t]');
  if(t){const key=t.dataset.t;U[key]=U[key]?0:1;save();syncSheet();if(U[key]){hap('medium');if(key==='snd')SND.on()}if(key==='live'){lfTop=0;const l=$('#lf');if(l)l.hidden=!U.live;if(U.live)lfPoll()}return}
  if(e.target.closest('[data-reset]')){Object.assign(U,DEF);save();themeSwitch(e.clientX,e.clientY);syncSheet();render();toast('Настройки сброшены','ok')}});

/* ---------- старт ---------- */
apply();sizeTrail();
if(!H.dataset.v)H.dataset.v=U.view;
})();
</script>
